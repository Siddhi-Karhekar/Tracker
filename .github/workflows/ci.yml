name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # least privilege: CI only reads the code

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]   # the lock file has per-version markers; test both
    env:
      TEAMPULSE_EMBEDDER: hash     # offline tests: no model download, no API keys
      LLM_PROVIDERS: "off"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact versions
        run: pip install -r requirements.lock pytest ruff pip-audit
      - name: Lint (errors, bug patterns, security rules)
        run: ruff check --select F,E9,B,S --ignore S105,S311,S608,B905,B008 teampulse views app.py
      - name: Tests
        run: python -m pytest -q
      - name: Dependency vulnerabilities
        # The ignored IDs are ChromaDB HTTP-server advisories with no fix yet. TeamPulse runs Chroma embedded
        # (no server, no port), so they can't be reached. Remove each ignore when a fixed version ships.
        run: >
          pip-audit -r requirements.lock
          --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

  windows:
    # Many students run TeamPulse on Windows; the lock file must install and the tests must pass there too.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TEAMPULSE_EMBEDDER: hash
      LLM_PROVIDERS: "off"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock pytest
      - run: python -m pytest -q

  ragas-wiring:
    # RAGAS needs older LangChain/OpenAI than the app, so it gets its own environment (requirements-eval.txt).
    # This checks the scorer drives the real RAGAS metrics; real scores need a judge key (see README).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-eval.txt pytest python-dotenv
      - run: python -m pytest -q --noconftest tests/eval_env
